# Runs on every pull request and on main. AI calls are simulated (demo mode), so no secrets are needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Some unit tests drive a headless Chromium (browser adapters, PDF export, the browsing agent).
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium for the app's own browser and most tests; WebKit for the iPhone Safari project.
      - name: Install Chromium and WebKit
        run: |
          npx playwright install --with-deps chromium webkit
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
      # Chrome leaves dangling Singleton*/RunningChromeVersion symlinks in data/browser-profile while it runs;
      # the build must not trace data/.
      - name: Plant a stale browser-profile marker
        run: mkdir -p data/browser-profile && ln -s 155.0.0.0:1 data/browser-profile/RunningChromeVersion
      - run: npm run build
      - run: npm run test:e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
